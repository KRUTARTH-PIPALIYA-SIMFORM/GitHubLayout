<html lang="en">
<head>

</head>
<body>

            <search id="globalSearch">
                <input type="text" placeholder="Search or jump to...">
                <button><kbd class="Search-module__kbd__WCskr">/</kbd></button>
            </search>
            <!-- Topbar Nav -->
            <ul id="topBarLinks">
                <li>
                    <a class="topNavAnchor" href="https://github.com/pullRequests">Pull requests</a>
                </li>
                <li>
                    <a class="topNavAnchor" href="https://github.com/issues">Issues</a>
                </li>
                <li>
                    <a class="topNavAnchor" href="https://github.com/marketplace">Marketplace</a>
                </li>
                <li>
                    <a class="topNavAnchor" href="https://github.com/explore">Explore</a>
                </li>
            </ul>
            <!-- Topbar Menus -->
            <ul id="topBarMenus">
                <li>
                    <a class="topNavMenu" href="https://github.com/profile/notification"><svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.146 3.248a2 2 0 0 1 3.708 0A7.003 7.003 0 0 1 19 10v4.697l1.832 2.748A1 1 0 0 1 20 19h-4.535a3.501 3.501 0 0 1-6.93 0H4a1 1 0 0 1-.832-1.555L5 14.697V10c0-3.224 2.18-5.94 5.146-6.752zM10.586 19a1.5 1.5 0 0 0 2.829 0h-2.83zM12 5a5 5 0 0 0-5 5v5a1 1 0 0 1-.168.555L5.869 17H18.13l-.963-1.445A1 1 0 0 1 17 15v-5a5 5 0 0 0-5-5z" fill="#0D0D0D"/></svg></a>
                </li>
                <li>
                    <a class="topNavMenu" href="https://github.com/profile/add"><svg width="25px" height="25px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z" fill="#0D0D0D"/></svg><svg width="24px" height="24px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="0" fill="none" width="24" height="24"/><g><path d="M7 10l5 5 5-5"/></g></svg></a>
                </li>
                <li>
                    <a class="topNavMenu" id="topProfilePicture" href="https://github.com/profile"><img src="assets/pfp.png" alt=""></a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Profile Navbar -->
        <nav>
            <ul>
                <li>
                    <a href="https://github.com/profile/Overview">

                    </a>
                </li>
                <li>
                    <a href="https://github.com/profile/projects">
                        <svg width="16px" height="16px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18.6 3H5.4A2.4 2.4 0 0 0 3 5.4v13.2A2.4 2.4 0 0 0 5.4 21h13.2a2.4 2.4 0 0 0 2.4-2.4V5.4A2.4 2.4 0 0 0 18.6 3Z" fill="#000000" fill-opacity=".16" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/><path d="M10 21V3M3 10h18" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/></svg>

                        Packages
                    </a>
                </li>
            </ul>
        </nav>
        <!-- About section -->
        <aside class="about">

        </aside>
        <!-- Repositories section -->
        <section id="repositoriesSection">

        </section>
        <!-- Heatmap section -->
        <section id="heatMapSection">

        </section>
        <!-- Activity section -->
        <section id="activitySection">

        </section>
    </main>
    <!-- footer -->
    <footer>

    </footer>
</body>
</html>
